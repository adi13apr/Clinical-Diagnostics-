# Load balancer for docker-compose.yml: round-robin over every api replica.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Docker's DNS. "resolve" below re-reads the replicas' addresses, so
    # `docker compose up --scale api=3` is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api {
        zone api 64k;               # needed for "resolve"; also shares round-robin state between workers
        server api:7860 resolve;    # one entry per replica IP; round-robin is the default
        keepalive 16;
    }

    server {
        listen 80;
        # MAX_UPLOAD_MB (10) plus multipart overhead; the API checks the exact limit itself
        client_max_body_size 11m;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Inline reports (no worker) can wait about 60 s on Groq's limit
            proxy_read_timeout 300s;
            # The balancer's own record of which replica answered, next to the API's X-Served-By
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
