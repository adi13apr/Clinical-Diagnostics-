<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chest X-ray screening aid: Normal, Pneumonia or Tuberculosis, with calibrated confidence and clinician referral." />
    <meta name="theme-color" content="#0e6e8c" />
    <title>Clinical Diagnostic Portal</title>
    <script>
      // Apply the saved theme before the first paint, so dark mode doesn't flash white
      try {
        var t = localStorage.getItem("theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
